name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Verify contact form key is configured
        env:
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
        run: |
          if [ -z "$VITE_WEB3FORMS_KEY" ]; then
            echo "::error::The VITE_WEB3FORMS_KEY repository variable is empty, so the contact form would deploy unable to send. Add it under Settings -> Secrets and variables -> Actions -> Variables (the Variables tab, not Secrets), then re-run this workflow."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
